<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test JS</title>
    <link rel="stylesheet" href="./css/style2.css">
</head>
<body>
    
    
    <h1 class="t1">Jouons avec JS et les éléments HTML interactifs</h1>
    <h1 class="t2">Voici un second titre</h1>
    <form action="">
        <input type="range" name="range" id="range" value="100"> 
        <input type="button" value="Clique" id="btn">
        <input type="checkbox" name="box" id="box">
        <input type="text" name="text" id="text" value="Recherche">


    </form>
    <script>
    let titre = document.querySelector(".t2");
    let titre1 = document.querySelector(".t1");

    titre1.addEventListener("mouseover", function(){
        titre1.style.color = "green";
    })
    //console.log(titre.value);
    
    //let curseur = document.getElementById("range");
    //console.log(curseur.value);

    let pression = false;

    let bouton = document.getElementById("btn");
    bouton.addEventListener("click",function(){
        
        if(pression == false){titre.style.color = "red" ;
            pression = true;
            
        }
        else {titre.style.color = "blue" ;
            pression = false;
        }

    });
    </script>
</body>
</html>
